name: check-live
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install TikTokLive requests
      - run: python check_live.py
        env:
          TIKTOK_USER: ${{ secrets.TIKTOK_USER }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name bot
          git config user.email bot@example.com
          git add state.txt || true
          git commit -m state || true
          git push || true
